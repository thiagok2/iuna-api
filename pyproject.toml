[project]
name = "iuna-api"
version = "0.1.0"
description = "API do projeto IUNA - Assistente inteligente para documentos do IFAL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "elasticsearch[async]>=8.12.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.10.0",
    "PyPDF2>=3.0.0",
    "typer>=0.9.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_spec.py"]
python_classes = ["Test*", "*Spec"]
python_functions = ["test_*", "spec_*"]
addopts = "-v --tb=short"
